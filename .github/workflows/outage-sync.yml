name: Telemetry & Outage Sync

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'outages.json'
      - 'threat_feed.json'
      - 'attack_map.json'
      - 'cables.json'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# One run at a time: overlapping runs (push + schedule + manual) used to collide when committing
concurrency:
  group: telemetry-sync
  cancel-in-progress: false

jobs:
  sync-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Auto-Log Git Push to Changelog Tab
        if: github.event_name == 'push'
        env:
          APPS_SCRIPT_WEBHOOK: ${{ secrets.APPS_SCRIPT_WEBHOOK }}
        run: python log_changelog.py

      - name: Execute Telemetry Scraper
        env:
          APPS_SCRIPT_WEBHOOK: ${{ secrets.APPS_SCRIPT_WEBHOOK }}
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
        run: python scrape_outages.py

      - name: Fetch CISA Threat Intel Feed
        # Never let a CISA/GitHub hiccup block the outage update; the last good feed is kept
        continue-on-error: true
        run: python fetch_threats.py

      - name: Fetch Attack Map Data (Cloudflare Radar + SANS DShield)
        continue-on-error: true
        env:
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
        run: python fetch_attacks.py

      - name: Fetch Submarine Cables (OpenStreetMap, once a day)
        continue-on-error: true
        timeout-minutes: 8
        run: python fetch_cables.py

      - name: Commit & Push Updated outages.json
        run: |
          git config --global user.name "hackatnight-bot"
          git config --global user.email "bot@hackatnight.com"
          # The data files are generated, so this run's copies always win: put them on top of the latest main
          # instead of rebasing (rebasing generated JSON made runs fail with merge conflicts).
          mkdir -p /tmp/telemetry
          for f in outages.json threat_feed.json attack_map.json cables.json; do [ -f "$f" ] && cp "$f" /tmp/telemetry/; done
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/telemetry/*.json .
          git add outages.json threat_feed.json attack_map.json cables.json
          git diff --staged --quiet && exit 0
          git commit -m "chore(telemetry): update live outages.json + threat feed"
          git push origin HEAD:main
