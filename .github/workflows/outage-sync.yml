name: Telemetry & Outage Sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Telemetry Scraper
        env:
          APPS_SCRIPT_WEBHOOK: ${{ secrets.APPS_SCRIPT_WEBHOOK }}
        run: python scrape_outages.py

      - name: Commit & Push Updated outages.json
        run: |
          git config --global user.name "hackatnight-bot"
          git config --global user.email "bot@hackatnight.com"
          git add outages.json
          git diff --staged --quiet || git commit -m "chore(telemetry): update live outages.json [v.2.3.0]"
          git push
