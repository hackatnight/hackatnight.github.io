name: Telemetry & Outage Sync

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'outages.json'
      - 'threat_feed.json'
      - 'attack_map.json'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Auto-Log Git Push to Changelog Tab
        if: github.event_name == 'push'
        env:
          APPS_SCRIPT_WEBHOOK: ${{ secrets.APPS_SCRIPT_WEBHOOK }}
        run: python log_changelog.py

      - name: Execute Telemetry Scraper
        env:
          APPS_SCRIPT_WEBHOOK: ${{ secrets.APPS_SCRIPT_WEBHOOK }}
        run: python scrape_outages.py

      - name: Fetch CISA Threat Intel Feed
        # Never let a CISA/GitHub hiccup block the outage update; the last good feed is kept
        continue-on-error: true
        run: python fetch_threats.py

      - name: Fetch Attack Map Data (Cloudflare Radar + SANS DShield)
        continue-on-error: true
        env:
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
        run: python fetch_attacks.py

      - name: Commit & Push Updated outages.json
        run: |
          git config --global user.name "hackatnight-bot"
          git config --global user.email "bot@hackatnight.com"
          git add outages.json threat_feed.json attack_map.json
          git diff --staged --quiet || git commit -m "chore(telemetry): update live outages.json + threat feed"
          git push
